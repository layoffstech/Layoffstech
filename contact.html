<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Mamta Media</title>
<meta name="description" content="News tip, correction ya sawaal bhejo.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<div id="hdr"></div>
<main>
<div class="wrap inner">
<h1>Get in <em>touch.</em></h1>
<p class="lead">News tip, correction, ya koi sawaal? Neeche form bharo ya email karo: <a href="mailto:your-email@example.com">your-email@example.com</a> (apna email yahan likho)</p>
<form class="form" name="contact" method="POST" action="thanks.html" data-netlify="true" netlify-honeypot="bot-field" style="margin-top:28px">
  <input type="hidden" name="form-name" value="contact">
  <p hidden><label>Don’t fill this: <input name="bot-field"></label></p>
  <label>Naam<input name="name" required></label>
  <label>Email<input type="email" name="email" required></label>
  <label>Topic<select name="topic"><option>News tip</option><option>Correction</option><option>Advertise</option><option>Other</option></select></label>
  <label>Message<textarea name="message" rows="5" required></textarea></label>
  <button class="btn" type="submit">Send message →</button>
</form></div>
</main>
<div id="ftr"></div>
<script src="js/posts.js"></script>
<script src="js/main.js"></script>
</body>
</html>
